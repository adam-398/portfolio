name: Deploy to Bunny

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload to Bunny
        uses: ayeressian/bunnycdn-storage-deploy@v2.2.3
        with:
          source: "dist"
          storageZoneName: ${{ secrets.BUNNY_STORAGE_NAME }}
          storageEndpoint: "se.storage.bunnycdn.com"
          storagePassword: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          accessKey: ${{ secrets.BUNNY_API_KEY }}
          pullZoneId: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          upload: "true"
          remove: "true"
          purgePullZone: "true"